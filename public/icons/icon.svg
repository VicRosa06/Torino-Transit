<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16162a"/>
      <stop offset="100%" stop-color="#0f0f1a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4"/>

  <!-- Glowing background circle -->
  <circle cx="256" cy="256" r="140" fill="url(#accent)" opacity="0.15" filter="url(#glow)"/>

  <!-- Tram/Bus Icon -->
  <g transform="translate(136, 126)">
    <!-- Tram body -->
    <rect x="30" y="40" width="180" height="200" rx="36" fill="url(#accent)"/>
    
    <!-- Windshield -->
    <rect x="46" y="60" width="148" height="68" rx="16" fill="#0f0f1a"/>
    <rect x="52" y="66" width="64" height="56" rx="8" fill="#1e1e35"/>
    <rect x="124" y="66" width="64" height="56" rx="8" fill="#1e1e35"/>

    <!-- Headlights -->
    <circle cx="68" cy="190" r="14" fill="#fbbf24"/>
    <circle cx="172" cy="190" r="14" fill="#fbbf24"/>
    
    <!-- Route sign -->
    <rect x="85" y="142" width="70" height="20" rx="6" fill="#16162a"/>
    <text x="120" y="156" font-family="-apple-system, system-ui, sans-serif" font-weight="bold" font-size="12" fill="#818cf8" text-anchor="middle">GTT</text>

    <!-- Pantograph / Antenna -->
    <path d="M 95 40 L 120 10 L 145 40" fill="none" stroke="#818cf8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="85" y1="10" x2="155" y2="10" stroke="#818cf8" stroke-width="6" stroke-linecap="round"/>

    <!-- Wheels / Track line -->
    <circle cx="70" cy="245" r="8" fill="#a0a0c0"/>
    <circle cx="170" cy="245" r="8" fill="#a0a0c0"/>
    <line x1="10" y1="255" x2="230" y2="255" stroke="rgba(255,255,255,0.2)" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
